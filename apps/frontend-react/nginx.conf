server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with a variable in proxy_pass, nginx
    # re-resolves the backend name instead of caching its IP at startup
    # (otherwise a restarted backend with a new IP becomes unreachable).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API: forward /api/* to the backend, keeping the /api prefix
    # (a variable proxy_pass without a URI part forwards the original URI).
    location /api/ {
        set $backend_upstream http://backend-express:3000;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
